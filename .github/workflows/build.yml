name: Test and build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Publish a release with this version (e.g. 0.3.0); leave empty to build without releasing"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries (headless)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    # Packaged apps on version tags (git tag v0.3.0 && git push --tags) or when run by hand
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-desktop.txt pyinstaller
      - run: pyinstaller packaging/cable_designer.spec --noconfirm --clean

      - name: Smoke-test and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The exe is a windowed app, so PowerShell won't wait for it unless told to
          $p = Start-Process -FilePath .\dist\CableDesigner.exe -ArgumentList "--smoke-test", "dist\smoke-test" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "smoke test failed (exit $($p.ExitCode))" }
          if (-not (Test-Path dist\smoke-test\smoke.pdf)) { throw "smoke test wrote no PDF" }
          $version = python -c "import cable_desktop; print(cable_desktop.__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$version" packaging\installer.iss
      - name: Smoke-test and package (macOS)
        if: runner.os == 'macOS'
        run: |
          QT_QPA_PLATFORM=offscreen dist/CableDesigner.app/Contents/MacOS/CableDesigner --smoke-test dist/smoke-test
          ditto -c -k --keepParent dist/CableDesigner.app dist/CableDesigner-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CableDesigner-${{ runner.os }}
          path: |
            dist/CableDesigner.exe
            dist/CableDesigner-*-setup.exe
            dist/CableDesigner-macos.zip
          if-no-files-found: error

  release:
    # On a v* tag push, or a manual run given a version (GitHub then creates the v<version> tag on this commit)
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version) }}
          name: Cable Designer ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version) }}
          target_commitish: ${{ github.sha }}
          files: artifacts/**/*
